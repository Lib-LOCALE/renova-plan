<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" width="1080" height="320" role="img" aria-label="RenovaPlan">
  <defs>
    <linearGradient id="rp-tile-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="rp-accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Blueprint / Architecture Emblem -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="216" height="216" rx="46" fill="url(#rp-tile-dark)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="3" />

    <!-- Subtle CAD Grid -->
    <g stroke="#bae6fd" stroke-opacity="0.16" stroke-width="2">
      <line x1="54" y1="18" x2="54" y2="198" />
      <line x1="108" y1="18" x2="108" y2="198" />
      <line x1="162" y1="18" x2="162" y2="198" />
      <line x1="18" y1="54" x2="198" y2="54" />
      <line x1="18" y1="108" x2="198" y2="108" />
      <line x1="18" y1="162" x2="198" y2="162" />
    </g>

    <!-- Architectural House Gable -->
    <path d="M 38 96 L 108 38 L 178 96" fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 54 88 L 54 174 L 162 174 L 162 88" fill="#0c4a6e" fill-opacity="0.55" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Interior Plan Walls: Existing + Demolition Dashed + New Green Extension -->
    <line x1="108" y1="82" x2="108" y2="132" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
    <line x1="108" y1="132" x2="162" y2="132" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="54" y1="132" x2="102" y2="132" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 9" />

    <!-- Amber Scale / Compass Accent -->
    <rect x="68" y="150" width="80" height="8" rx="4" fill="#fbbf24" />
    <circle cx="108" cy="132" r="8" fill="#fbbf24" stroke="#082f49" stroke-width="3" />
  </g>

  <!-- Wordmark -->
  <text x="302" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="-2.5">
    <tspan fill="#f8fafc">Renova</tspan><tspan fill="#38bdf8">Plan</tspan>
  </text>

  <!-- Accent Rule -->
  <rect x="304" y="190" width="160" height="4" rx="2" fill="url(#rp-accent-dark)" />

  <!-- Tagline -->
  <text x="304" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="600" letter-spacing="2.4" fill="#94a3b8">
    2D / 3D CAD  •  BOQ ESTIMATES  •  FR / EN
  </text>
</svg>
