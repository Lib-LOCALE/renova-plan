[package]
name = "renova-plan"
version = "0.2.0"
description = "Plans 2D, maquette 3D et chiffrage de rénovation, hors ligne"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
